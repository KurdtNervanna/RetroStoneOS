; RetroStoneOS input remap: Atari 400/800/XL/XE (atari800 core, "Atari
; joystick" controller). Installed as /usr/share/rsos/remaps/atari800.ini;
; user overrides: /data/rsos/remaps/atari800.ini or atari800/<game>.ini.
; Format: see megadrive.ini.
;
; The core reads the RetroPad as B = fire, A = second fire (unused by
; one-button joystick games), Y = Space, X = Return, Select/Start = the SELECT
; and START console keys, L = OPTION, L2 = Esc, R2 = Help, L3 = its on-screen
; keyboard; R is not used. Here A and B both fire, R2 opens the on-screen
; keyboard (L3 is the optional C button almost no unit has) and Help moves to
; R. RESET is Select+B (the frontend's reset hotkey: a cold start).
; Select+R2 stays fast-forward (hotkeys read the physical buttons, before
; this remap); Select alone reaches the core.
[remap]
a = b         ; right: fire
b = b         ; bottom: fire
y = y         ; left: Space
x = x         ; top: Return
l = l         ; OPTION
r = r2        ; Help
l2 = l2       ; Esc
r2 = l3       ; on-screen keyboard
select = select
start = start

[options]
dpad_to_analog = 0
