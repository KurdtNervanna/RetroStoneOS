; RetroStoneOS input remap: Atari 5200 (atari800 core in 5200 mode, "Atari
; 5200 joystick" controller). Installed as /usr/share/rsos/remaps/atari5200.ini;
; user overrides: /data/rsos/remaps/atari5200.ini or atari5200/<game>.ini.
; Format: see megadrive.ini.
;
; The core reads the RetroPad as B = fire 1, A = fire 2, Start = START,
; Select = PAUSE, X = *, Y = #, L/R/L2/R2 = keypad 0/1/2/3, L3 = keypad 7 and
; R3 = its on-screen keyboard (the whole keypad, RESET included). Here the
; right button is the main fire, R2 opens the on-screen keyboard (R3 is the
; optional Z button almost no unit has) and keypad 3 is reached through it.
; Select+B resets the console (the frontend's hotkey); Select+R2 stays
; fast-forward (hotkeys read the physical buttons, before this remap).
[remap]
a = b         ; right: fire 1
b = a         ; bottom: fire 2
x = x         ; top: *
y = y         ; left: #
l = l         ; keypad 0
r = r         ; keypad 1
l2 = l2       ; keypad 2
r2 = r3       ; on-screen keyboard (keypad)
select = select   ; PAUSE
start = start     ; START

[options]
dpad_to_analog = 0
