# BlueZ (bluetoothd) settings of RetroStoneOS; everything not set here keeps
# BlueZ's default. Bluetooth is switched on and off by rsos-net, the devices
# are paired from Settings > Network > Bluetooth devices (rsos-bt).

[General]
# A controller that was paired with another console or phone since (it lost
# our keys) pairs again without asking: the console has no agent to ask the
# player, and pads have no PIN.
JustWorksRepairing = always

[Policy]
# Power the controller on as soon as bluetoothd finds it (rsos-net bt on),
# so paired pads reconnect without opening any menu.
AutoEnable = true
# Paired, trusted pads that drop out (out of range, a flat battery) are
# called back: 7 tries over about 2 minutes (BlueZ's default, spelled out).
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
