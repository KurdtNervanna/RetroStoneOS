; RetroStoneOS core metadata. Format: docs/cores.md, "Core metadata files".
[core]
id = atari800
display_name = Atari800
library = /usr/lib/libretro/atari800_libretro.so
commit = 4e7fbc73765c1a9670c7506616046ad1d4ccda51
license = GPL-2.0+
; One core, two ROM folders: "atari800" (400/800, XL/XE, XEGS: disks .atr
; .xfd .atx .dcm, tapes .cas, programs .xex .com, cartridges .car .rom .bin)
; and "atari5200" (cartridges .a52 .bin). The core starts a .a52 file, and a
; .bin or .rom it finds in its 5200 cartridge database, as a 5200 whatever the
; options say; [options.atari5200] below covers the other 5200 .bin dumps.
systems = atari800, atari5200
default_systems = atari800, atari5200
; The core lists "zip" too but cannot open one (its loader passes the path to
; the emulator, which only reads .gz): no zip here, and force_extract makes
; the host unpack a .zip before the core sees it.
extensions = atr, xfd, atx, dcm, cas, xex, com, car, rom, bin, a52, m3u
need_fullpath = true
block_extract = false
force_extract = true
savestates = true
renderer = software
pixel_format = rgb565

; No BIOS needed: the Altirra OS (400/800 and XL/XE), the Altirra 5200 OS and
; Altirra BASIC are built into the core. The original ROMs are used instead
; when they are in the system directory ("auto" ROM options); the core finds
; them by checksum, any file name. MD5s from atari800_libretro.info.
[bios:5200.rom]
md5 = 281f20ea4320404ec820fb7ec0693b38
required = no
description = Atari 5200 BIOS (optional: Altirra 5200 OS built in)

[bios:ATARIXL.ROM]
md5 = 06daac977823773a3eea3422fd26a703
required = no
description = Atari XL/XE OS (optional: AltirraOS built in)

[bios:ATARIOSB.ROM]
md5 = 4177f386a3bac989a981d3fe3388cb6c
required = no
description = Atari 400/800 OS B (optional: AltirraOS built in)

[bios:ATARIOSA.ROM]
md5 = eb1f32f5d9f382db1bbfb8d7f9cb343a
required = no
description = Atari 400/800 OS A (optional)

[bios:ATARIBAS.ROM]
md5 = 0bac0c6a50104045d902df4503a4c30b
required = no
description = Atari BASIC (optional: Altirra BASIC built in)

[options]
; Never read or write the legacy ~/.atari800.cfg (the core default, set here
; so a changed upstream default cannot make it write to the read-only root:
; the frontend runs with HOME=/).
atari800_cfg = disabled
; Host key (not a core option): never call retro_set_controller_port_device.
; The core picks its own controller per port, the Atari joystick, or the 5200
; controller when it runs a 5200 game; a plain RetroPad would break the 5200
; keypad, its second button and the on-screen keyboard button.
rsos-port-device = core

; Per-system defaults (docs/cores.md, "Core metadata files"): the "atari5200"
; folder runs the 5200, the "atari800" folder keeps the core default (800XL).
[options.atari5200]
atari800_system = 5200
